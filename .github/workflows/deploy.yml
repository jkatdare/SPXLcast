# Build the image in Azure Container Registry and roll it out to the scheduled job and the status
# page on every push to master (and on demand). Tests gate the deployment.
#
# One-time setup (see infra/DEPLOY.md, "GitHub auto-deploy"): an Azure app registration with a
# federated credential for this repo, Contributor on the resource group, and three repository
# secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. No passwords are stored.
name: Deploy to Azure

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "logs/**", "output/**"]
  workflow_dispatch:

permissions:
  id-token: write      # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: spxlcast-rg
  ACR_NAME: spxlcastacr
  JOB_NAME: spxlcast-daily
  WEB_NAME: spxlcast-web
  CRON: "40 13-21 * * 1-5"   # UTC: hourly through the US session plus one run after the close

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          az acr build -r "$ACR_NAME" -t "spxlcast:${GITHUB_SHA}" -t "spxlcast:latest" . -o none
      - name: Roll out to the job and the web app
        run: |
          az extension add --name containerapp --upgrade -o none
          SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          IMAGE="$SERVER/spxlcast:${GITHUB_SHA}"
          az containerapp job update -n "$JOB_NAME" -g "$RESOURCE_GROUP" --image "$IMAGE" \
              --cron-expression "$CRON" --replica-retry-limit 2 -o none
          az containerapp update -n "$WEB_NAME" -g "$RESOURCE_GROUP" --image "$IMAGE" \
              --min-replicas 1 --max-replicas 1 --set-env-vars SPXLCAST_LIVE=1 -o none
          echo "deployed $IMAGE"
