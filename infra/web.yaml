# Azure Container App: the read-only status page (latest report, chart, score, downloads).
# Always on (one replica): it re-prices the forecast at the live quote every minute of the session.
# Placeholders in ${...} are filled in by infra/deploy.ps1.
location: ${LOCATION}
name: ${WEB_NAME}
properties:
  environmentId: ${ENV_ID}
  configuration:
    ingress:
      external: true
      targetPort: 8000
      transport: auto
      allowInsecure: false   # must be explicit: the CLI otherwise sends null and the API rejects it
    registries:
      - server: ${ACR_SERVER}
        username: ${ACR_USER}
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: ${ACR_PASSWORD}
  template:
    containers:
      - name: ${WEB_NAME}
        image: ${ACR_SERVER}/spxlcast:latest
        command: ["python", "-m", "spxlcast", "serve", "--root", "/data", "--port", "8000", "--live"]
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: SPXLCAST_DATA
            value: /data
          - name: SPXLCAST_LIVE
            value: "1"
        volumeMounts:
          - volumeName: data
            mountPath: /data
    scale:
      minReplicas: 1              # always on: the live minute loop runs inside this container
      maxReplicas: 1
    volumes:
      - name: data
        storageType: AzureFile
        storageName: data
